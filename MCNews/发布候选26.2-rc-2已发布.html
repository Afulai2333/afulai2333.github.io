<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布候选26.2-rc-2已发布</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.7;
            padding: 20px 15px;
            max-width: 900px;
            margin: 0 auto;
            
        }

        .header {
            margin-bottom: 30px;
        }

        .headerimage img {
            width: 100%;
            border-radius: 16px;
            object-fit: cover;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            margin-bottom: 16px;
        }

        .title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .headertitle {
            font-size: 24px;
            font-weight: 700;
            color: #222;
        }

        .headercategory {
            background-color: #e9f0ff;
            color: #3a6cf4;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
        }

        .content {
            background-color: #fff;
            padding: 24px;
            border-radius: 18px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
        }

        .content p {
            font-size: 16px;
            margin-bottom: 16px;
            color: #444;
        }

        ul {
            padding-left: 22px;
            margin-bottom: 16px;
        }

        li {
            margin-bottom: 10px;
            font-size: 16px;
            color: #444;
        }

        li ul {
            margin-top: 6px;
            padding-left: 20px;
        }

        li ul li {
            margin-bottom: 6px;
            color: #555;
        }

        code {
            font-family: "SF Mono", "Consolas", "Monaco", monospace;
            background-color: #f1f3f5;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 14px;
            color: #d63384;
            font-weight: 500;
            word-break: break-all;
        }

        .content h1 { font-size: 1.8em; margin: 0.8em 0; color: #222; }
        .content h2 { font-size: 1.5em; margin: 0.8em 0; color: #222; }
        .content h3 { font-size: 1.25em; margin: 0.8em 0; color: #333; }
        .content a { color: #3a6cf4; text-decoration: none; }
        .content a:hover { text-decoration: underline; }
        .content blockquote { border-left: 4px solid #3a6cf4; margin: 1em 0; padding: 0.5em 1em; background: #f9f9f9; color: #666; }
        .content pre { background: #f5f5f5; color: #333; padding: 15px; border: 2px solid #888; border-radius: 10px; overflow-x: auto; margin: 1em 0; }
        .content pre code { background: none; padding: 0; color: inherit; border: none; border-radius: 0; font-size: inherit; }
        .content img { max-width: 100%; height: auto; border-radius: 8px; }

        .content .info {
            background-color: #f1f5ff;
            border: 2px solid #3a6cf4;
            border-radius: 12px;
            padding: 16px;
            margin: 16px 0;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            color: #444;
            font-size: 15px;
        }

        .content .info::before {
            content: "ⓘ";
            font-size: 18px;
            color: #3a6cf4;
            font-weight: bold;
            flex-shrink: 0;
        }

        .content .warn {
            background-color: #fff5f5;
            border: 2px solid #e53e3e;
            border-radius: 12px;
            padding: 16px;
            margin: 16px 0;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            color: #444;
            font-size: 15px;
        }

        .content .warn::before {
            content: "⚠";
            font-size: 18px;
            color: #e53e3e;
            font-weight: bold;
            flex-shrink: 0;
        }

        .content .mourn {
            background-color: #333;
            border: 2px solid #fff;
            border-radius: 12px;
            padding: 20px;
            margin: 16px 0;
            text-align: center;
            color: #fff;
            font-size: 16px;
            line-height: 1.8;
        }

        table { width: 100%; border-collapse: separate; border-spacing: 0; border-radius: 12px; overflow: hidden; background-color: #fff; margin: 20px 0; font-size: 16px; box-shadow: 0 1px 5px rgba(0,0,0,0.05); }
        thead th { background-color: #f1f5ff; color: #222; font-weight: 500; text-align: left; padding: 12px 16px; border-bottom: 1px solid #eaecef; }
        tbody td { padding: 12px 16px; color: #444; border-bottom: 1px solid #f0f0f0; }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover { background-color: #f9fbfd; }

        @media (max-width: 600px) {
            body {
                padding: 15px 10px;
            }

            .headertitle {
                font-size: 20px;
            }

            .content {
                padding: 18px 16px;
                border-radius: 14px;
            }

            .headerimage img {
                border-radius: 12px;
            }

            table { font-size: 15px; border-radius: 8px; }
            th, td { padding: 10px 12px !important; }
        }
    </style>
</head>
<body>
<div class="header">
    <div class="headerimage">
        <img src="https://www.minecraft.net/content/dam/minecraftnet/article-asset/2026/minecraft-26-2-release-candidate-2/new-article-hero-image.jpg" alt="发布候选26.2-rc-2已发布">
    </div>
    <div class="title-row">
        <div class="headertitle">
            发布候选26.2-rc-2已发布
        </div>
        <div class="headercategory">
            麦块版讯
        </div>
    </div>
</div>

<div class="content">
    <p>发布候选26.2-rc-2已发布，修复了如下两个漏洞：</p>
<ul>
<li>MC-308731 - 在特定设置下，生存模式玩家可能会被困在带有硫方怪的坑中，陷入软锁定。</li>
<li>在高度限制处重生导致重生时间比正常情况长得多。</li>
</ul>

</div>
</body>
</html>
